<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Votre collection personnelle de parfums.">
<meta name="theme-color" content="#0c0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parfum">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<script>
try{var s=JSON.parse(localStorage.getItem("parfum.settings")||"{}");if(s.theme==="light"||s.theme==="dark")document.documentElement.setAttribute("data-mode",s.theme);}catch(e){}
</script>
<style>:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Parfum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Cormorant+Garamond:wght@500;600;700&display=swap">
<style>
/* Layout : une colonne mobile-first, panneaux de verre posés sur une lumière graphite diffuse ; grille 2 → 3 → 4 colonnes */
:root{
  --bg:#e9eaec; --ink:#16171a; --ink-2:#5a5d64; --ink-3:#8d9098;
  --line:rgba(22,23,26,.09); --line-strong:rgba(22,23,26,.18);
  --glass-rgb:255,255,255; --hi:rgba(255,255,255,.95);
  --shadow:0 10px 28px rgba(28,32,40,.08),0 1px 2px rgba(28,32,40,.05);
  --amb-1:rgba(255,255,255,.95); --amb-2:rgba(255,255,255,.6); --amb-3:rgba(150,155,165,.22);
  --img-1:#f6f7f8; --img-2:#d9dbdf;
  --bottle-glass:#202125; --bottle-cap:#0f1012; --bottle-clear:rgba(112,118,128,.34); --bottle-hi:rgba(255,255,255,.3);
  --bottle-label:#e4e5e8; --bottle-shadow:rgba(0,0,0,.16);
  --solid:#ffffff; --chip:rgba(22,23,26,.055); --chip-on:#16171a; --chip-on-ink:#ffffff;
  --danger:#b42318; --track:rgba(22,23,26,.08); --bar:#3a3c42; --scrim:rgba(20,22,26,.28);
  --mode-dark:0;
  --font-display:"Marcellus","Optima","Candara","Didot",serif;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --blur:24px; --ga:.5; --dur:.34s; --ease:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-mode="light"]){
    --bg:#0c0c0e; --ink:#f5f5f6; --ink-2:#a7a9af; --ink-3:#73767d;
    --line:rgba(255,255,255,.1); --line-strong:rgba(255,255,255,.2);
    --glass-rgb:72,73,78; --hi:rgba(255,255,255,.16); --shadow:0 16px 40px rgba(0,0,0,.5);
    --amb-1:rgba(255,255,255,.11); --amb-2:rgba(255,255,255,.05); --amb-3:rgba(0,0,0,.55);
    --img-1:#3c3d42; --img-2:#17181b;
    --bottle-glass:#0d0e10; --bottle-cap:#040405; --bottle-clear:rgba(205,210,218,.17); --bottle-hi:rgba(255,255,255,.15);
    --bottle-label:#c9cbd0; --bottle-shadow:rgba(0,0,0,.55);
    --solid:#1c1d20; --chip:rgba(255,255,255,.075); --chip-on:#f5f5f6; --chip-on-ink:#111214;
    --danger:#ff7b6f; --track:rgba(255,255,255,.08); --bar:#d6d8dc; --scrim:rgba(0,0,0,.5);
    --mode-dark:1; color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-mode="light"]), :root[data-mode="dark"]{
    --bg:#0c0c0e; --ink:#f5f5f6; --ink-2:#a7a9af; --ink-3:#73767d;
    --line:rgba(255,255,255,.1); --line-strong:rgba(255,255,255,.2);
    --glass-rgb:72,73,78; --hi:rgba(255,255,255,.16); --shadow:0 16px 40px rgba(0,0,0,.5);
    --amb-1:rgba(255,255,255,.11); --amb-2:rgba(255,255,255,.05); --amb-3:rgba(0,0,0,.55);
    --img-1:#3c3d42; --img-2:#17181b;
    --bottle-glass:#0d0e10; --bottle-cap:#040405; --bottle-clear:rgba(205,210,218,.17); --bottle-hi:rgba(255,255,255,.15);
    --bottle-label:#c9cbd0; --bottle-shadow:rgba(0,0,0,.55);
    --solid:#1c1d20; --chip:rgba(255,255,255,.075); --chip-on:#f5f5f6; --chip-on-ink:#111214;
    --danger:#ff7b6f; --track:rgba(255,255,255,.08); --bar:#d6d8dc; --scrim:rgba(0,0,0,.5);
    --mode-dark:1; color-scheme:dark;
}
:root[data-mode="light"]{color-scheme:light}
:root[data-font="manrope"]{--font-body:"Manrope",-apple-system,"Helvetica Neue",Arial,sans-serif}
:root[data-font="dmsans"]{--font-body:"DM Sans",-apple-system,"Helvetica Neue",Arial,sans-serif}
:root[data-font="cormorant"]{--font-body:"Cormorant Garamond","Garamond","Times New Roman",serif}
:root[data-motion="reduced"]{--dur:.14s}
:root[data-motion="none"] *, :root[data-motion="none"] *::before{transition:none!important;animation:none!important}
@media (prefers-reduced-motion: reduce){:root{--dur:.12s}}

*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.4;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100%;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(90% 55% at 100% 0%,var(--amb-1),transparent 62%),
  linear-gradient(118deg,transparent 30%,var(--amb-2) 46%,transparent 62%),
  radial-gradient(90% 55% at 0% 100%,var(--amb-3),transparent 70%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--ink-3);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}
.ic.lg{width:26px;height:26px}
.num{font-variant-numeric:tabular-nums}

/* verre */
.glass{background:rgba(var(--glass-rgb),var(--ga));-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);backdrop-filter:blur(var(--blur)) saturate(150%);
  border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi),var(--shadow)}
:root[data-cards="mat"] .card{background:var(--solid);-webkit-backdrop-filter:none;backdrop-filter:none}
:root[data-cards="contour"] .card{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;border-color:var(--line-strong)}

.page{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:22px calc(178px + env(safe-area-inset-bottom,0px))}
.page > * + *{margin-top:16px}

/* en-tête */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:12px;margin-bottom:22px}
.brandmark h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2rem,9vw,2.6rem);letter-spacing:.3em;margin:0;line-height:1}
.brandmark p{font-size:.64rem;letter-spacing:.52em;color:var(--ink-2);margin:.85rem 0 0;text-transform:uppercase;line-height:1.3}
.theme-toggle{display:flex;align-items:center;border-radius:999px;padding:5px;flex:none}
.theme-toggle button{width:44px;height:40px;display:grid;place-items:center;border-radius:999px;color:var(--ink-3);transition:color var(--dur),background var(--dur)}
.theme-toggle button.on{color:var(--ink);background:var(--chip)}
.theme-toggle .sep{width:1px;height:22px;background:var(--line-strong)}

.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:12px;margin-bottom:18px}
.view-head h2{font-family:var(--font-display);font-weight:400;font-size:2rem;letter-spacing:.06em;margin:0;line-height:1.05}
.view-head p{margin:.4rem 0 0;color:var(--ink-2);font-size:.88rem}

/* recherche */
.search{display:flex;align-items:center;gap:10px;border-radius:999px;height:56px;padding:0 8px 0 20px}
.search .ic{color:var(--ink-2)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:max(16px,1rem);outline:none;height:100%}
.search input::placeholder{color:var(--ink-3)}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{width:32px;height:32px;display:grid;place-items:center;color:var(--ink-3)}
.search .div{width:1px;height:28px;background:var(--line-strong)}
.search .filter-btn{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:999px}
.badge{position:absolute;top:4px;right:3px;min-width:17px;height:17px;border-radius:9px;background:var(--chip-on);color:var(--chip-on-ink);font-size:.66rem;font-weight:600;display:grid;place-items:center;padding:0 4px}

/* tuiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{border-radius:22px;padding:14px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;transition:transform var(--dur) var(--ease)}
.tile:active{transform:scale(.97)}
.tile .ic{margin-bottom:4px}
.tile strong{font-size:1.28rem;font-weight:600;line-height:1.1;white-space:nowrap}
.tile span{font-size:.74rem;color:var(--ink-2);white-space:nowrap}
.tile.on{outline:1.5px solid var(--ink-2);outline-offset:-1.5px}
@media (max-width:360px){.tile strong{font-size:1.08rem}.tile span{font-size:.68rem}}

.note-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:18px;padding:10px 10px 10px 16px;font-size:.84rem;color:var(--ink-2)}
.note-bar button{flex:none}
.link-btn{font-size:.84rem;font-weight:600;color:var(--ink);padding:8px 12px;border-radius:999px;background:var(--chip)}

/* grille de cartes */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:980px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{position:relative;border-radius:26px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-width:0;
  transition:transform var(--dur) var(--ease);animation:rise var(--dur) var(--ease) both}
.card:active{transform:scale(.98)}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
.visual{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 18%,var(--img-1),var(--img-2))}
.visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.visual .bottle{position:absolute;left:50%;bottom:5%;height:86%;transform:translateX(-50%)}
.card .visual{aspect-ratio:1/.86;max-width:100%}
.fav{position:absolute;top:8px;right:8px;width:40px;height:40px;display:grid;place-items:center;border-radius:999px;color:#fff;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.35));transition:transform var(--dur) var(--ease)}
.fav:active{transform:scale(.85)}
.fav.on .ic{fill:currentColor}
.visual.ph .fav{color:var(--ink);filter:none}
.card-body{position:relative;padding:12px 14px 14px;min-width:0;flex:1;display:flex;flex-direction:column}
.card-body h3{margin:0;font-size:1.02rem;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-body .brand{margin:2px 0 0;font-size:.86rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin-top:auto;padding-top:10px;padding-right:40px;min-height:40px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 9px;font-size:.74rem;color:var(--ink-2);background:var(--chip);border:1px solid var(--line);white-space:nowrap}
.price{font-weight:600;font-size:.95rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.go{position:absolute;right:10px;bottom:12px;width:34px;height:34px;border-radius:999px;display:grid;place-items:center;background:var(--chip);border:1px solid var(--line)}
.ex-tag{position:absolute;left:10px;top:10px;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;border-radius:999px;
  background:rgba(0,0,0,.42);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.grid.is-list{grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:760px){.grid.is-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid.is-list .card{flex-direction:row;border-radius:22px}
.grid.is-list .card .visual{aspect-ratio:1/1;width:96px;flex:none}
.grid.is-list .visual .fav,.grid.is-list .ex-tag{display:none}
.grid.is-list .card-body{padding:12px 14px}
.grid.is-list .card-meta{min-height:0;padding-top:8px}

/* état vide */
.empty{border-radius:28px;padding:34px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ic{width:34px;height:34px;color:var(--ink-3)}
.empty h3{margin:4px 0 0;font-size:1.1rem;font-weight:600}
.empty p{margin:0;color:var(--ink-2);font-size:.9rem;max-width:34ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;font-weight:600;font-size:.95rem;
  background:var(--chip-on);color:var(--chip-on-ink);transition:transform var(--dur) var(--ease),opacity var(--dur)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:transparent}
.btn[disabled]{opacity:.5}

/* collection */
.seg-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.seg-scroll::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:999px;font-size:.88rem;background:var(--chip);border:1px solid var(--line);white-space:nowrap;transition:background var(--dur),color var(--dur)}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:transparent}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;flex:none}
.view-switch{display:flex;border-radius:999px;padding:4px}
.view-switch button{width:40px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--ink-3)}
.view-switch button.on{background:var(--chip);color:var(--ink)}
.stat-link{display:flex;align-items:center;gap:14px;border-radius:24px;padding:16px 16px;width:100%;text-align:left}
.stat-link .k{flex:1;min-width:0}
.stat-link strong{display:block;font-weight:600}
.stat-link span{color:var(--ink-2);font-size:.84rem}
.sort{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:.86rem}
.sort select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:8px 32px 8px 14px;font-size:max(16px,.9rem);color:var(--ink);
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.group-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 10px}
.group-h h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.2rem;letter-spacing:.08em}
.group-h span{color:var(--ink-3);font-size:.8rem}

/* wishlist */
.wish{border-radius:24px;overflow:hidden;display:grid;grid-template-columns:112px minmax(0,1fr)}
.wish .visual{min-height:132px}
.wish-body{padding:14px 14px 12px;min-width:0;display:flex;flex-direction:column;gap:2px}
.wish-body h3{margin:0;font-size:1.02rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wish-body .brand{margin:0;color:var(--ink-2);font-size:.86rem}
.wish-body .notes{margin:6px 0 0;color:var(--ink-2);font-size:.84rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wish-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:10px}
.mini{height:34px;padding:0 12px;border-radius:999px;font-size:.8rem;display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--line);color:var(--ink);text-decoration:none;white-space:nowrap}
.mini.primary{background:var(--chip-on);color:var(--chip-on-ink);border-color:transparent}
.mini.warn{color:var(--danger)}
.stack{display:grid;gap:12px}
@media (min-width:760px){.stack.two{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* réglages */
.group{border-radius:24px;overflow:hidden}
.group-title{margin:24px 6px 8px;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;min-height:56px}
.set-row + .set-row{border-top:1px solid var(--line)}
.set-row > .k{min-width:0}
.set-row .k strong{display:block;font-weight:500}
.set-row .k span{display:block;color:var(--ink-3);font-size:.8rem;margin-top:2px}
.set-row.col{flex-direction:column;align-items:stretch;gap:10px}
.set-row .v{color:var(--ink-2);font-size:.86rem;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px;border:1px solid var(--line)}
.seg button,.seg label{flex:1;height:36px;border-radius:999px;display:grid;place-items:center;font-size:.86rem;padding:0 10px;white-space:nowrap;color:var(--ink-2);cursor:pointer;transition:background var(--dur),color var(--dur)}
.seg .on,.seg input:checked + span{background:var(--solid);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg label{padding:0}
.seg label span{display:grid;place-items:center;width:100%;height:100%;border-radius:999px;transition:background var(--dur)}
.seg input{position:absolute;opacity:0;pointer-events:none}
input[type=range]{width:100%;accent-color:var(--ink);height:28px}
.font-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.font-opts button{border-radius:16px;padding:12px;text-align:left;background:var(--chip);border:1px solid var(--line)}
.font-opts button.on{border-color:var(--ink-2);background:var(--solid)}
.font-opts b{display:block;font-size:1.1rem;font-weight:500}
.font-opts small{color:var(--ink-3);font-size:.74rem}
.steps{margin:0;padding-left:1.2em;color:var(--ink-2);font-size:.88rem;line-height:1.6}
.foot{text-align:center;color:var(--ink-3);font-size:.76rem;margin-top:26px;letter-spacing:.08em}

/* barre d'onglets */
.tabbar{position:fixed;z-index:30;left:0;right:0;margin:0 auto;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:min(560px,calc(100% - 24px));
  height:72px;border-radius:36px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:0 6px}
.tabbar button{position:relative;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-3);font-size:.7rem;transition:color var(--dur)}
.tabbar button + button::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:1px;background:var(--line)}
.tabbar button.on{color:var(--ink)}
.tabbar button.on::after{content:"";position:absolute;bottom:3px;width:34px;height:2px;border-radius:2px;background:var(--ink)}
.fab{position:fixed;z-index:29;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);height:54px;padding:0 26px 0 22px;border-radius:999px;
  display:flex;align-items:center;gap:12px;font-size:1rem;white-space:nowrap;transition:transform var(--dur) var(--ease)}
.fab:active{transform:translateX(-50%) scale(.96)}

/* pages superposées */
.ov{position:fixed;inset:0;z-index:50;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  background:radial-gradient(90% 50% at 100% 0%,var(--amb-1),transparent 62%),radial-gradient(90% 55% at 0% 100%,var(--amb-3),transparent 70%),var(--bg);
  transform:translateX(100%);transition:transform var(--dur) var(--ease);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
.ov.in{transform:none}
.ov-inner{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov-bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px}
.ov-bar.solid{background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov-bar h2{flex:1;margin:0;text-align:center;font-size:1rem;font-weight:600}
.ov-bar .spacer{flex:1}
.txt-btn{height:40px;padding:0 14px;border-radius:999px;font-size:.95rem;color:var(--ink-2)}
.txt-btn.strong{color:var(--chip-on-ink);background:var(--chip-on);font-weight:600}

.hero{border-radius:32px;aspect-ratio:1/1;max-height:58vh;width:100%;max-width:100%;margin-top:4px}
.hero .bottle{height:80%;bottom:8%}
.d-head{margin:22px 4px 0}
.d-head .eyebrow{margin:0;font-size:.74rem;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-2)}
.d-head h1{margin:.4rem 0 0;font-family:var(--font-display);font-weight:400;font-size:clamp(1.9rem,8vw,2.6rem);line-height:1.1;letter-spacing:.02em;text-wrap:balance}
.d-head .d-price{margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.d-head .d-price strong{font-size:1.4rem;font-weight:600}
.specs{border-radius:24px;margin-top:20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.specs div{padding:14px 16px;border-top:1px solid var(--line);min-width:0}
.specs div:nth-child(-n+2){border-top:0}
.specs div:nth-child(odd){border-right:1px solid var(--line)}
.specs dt{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.specs dd{margin:4px 0 0;font-weight:500;overflow-wrap:anywhere}
.sec{border-radius:24px;padding:16px;margin-top:14px}
.sec h3{margin:0 0 12px;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.sec p{margin:0;white-space:pre-wrap;line-height:1.55}
.pyr{display:grid;gap:12px}
.pyr-row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:start}
.pyr-row > span{font-size:.8rem;color:var(--ink-3);padding-top:6px}
.notes-chips{display:flex;flex-wrap:wrap;gap:6px}
.notes-chips i{font-style:normal;font-size:.84rem;padding:5px 11px;border-radius:999px;background:var(--chip);border:1px solid var(--line)}
.d-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}
.d-actions .btn{padding:0 10px;font-size:.88rem}
.confirm{border-radius:24px;padding:16px;margin-top:20px;display:grid;gap:12px}
.confirm p{margin:0}
.confirm .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* formulaire */
.f-sec{border-radius:24px;padding:16px;margin-top:14px;display:grid;gap:14px}
.f-sec > h3{margin:0;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.field{display:grid;gap:6px;min-width:0}
.field > span{font-size:.8rem;color:var(--ink-2)}
.field > span em{font-style:normal;color:var(--ink-3)}
.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--chip);border-radius:14px;padding:12px 14px;font-size:max(16px,1rem);outline:none;
  transition:border-color var(--dur)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink-3)}
.field textarea{min-height:92px;resize:vertical;line-height:1.45}
.field select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 19px) 52%,calc(100% - 14px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.field input[type=date]{-webkit-appearance:none;appearance:none;min-height:48px}
.field.err input{border-color:var(--danger)}
.field .msg{color:var(--danger);font-size:.8rem}
.f-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.photo{border-radius:28px;aspect-ratio:1/1;max-height:46vh;width:100%;max-width:100%;margin-top:6px}
.photo-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:999px;background:var(--chip);border:1px solid var(--line);display:grid;place-items:center}
.stepper input{width:64px!important;text-align:center}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.switch input{position:absolute;opacity:0}
.switch i{width:50px;height:30px;border-radius:999px;background:var(--track);position:relative;flex:none;transition:background var(--dur);border:1px solid var(--line)}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform var(--dur) var(--ease)}
.switch input:checked + i{background:var(--chip-on)}
.switch input:checked + i::after{transform:translateX(20px);background:var(--chip-on-ink)}
.hint{font-size:.78rem;color:var(--ink-3)}

/* feuille du bas */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity var(--dur)}
.sheet-wrap.in .scrim{opacity:1}
.sheet{position:relative;width:min(640px,100%);max-height:88vh;overflow-y:auto;overscroll-behavior:contain;border-radius:30px 30px 0 0;
  background:rgba(var(--glass-rgb),.86);-webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);
  border:1px solid var(--line);border-bottom:0;box-shadow:inset 0 1px 0 var(--hi),0 -10px 40px rgba(0,0,0,.2);
  transform:translateY(100%);transition:transform var(--dur) var(--ease);
  padding:8px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px))}
:root[data-mode="dark"] .sheet{background:rgba(32,33,36,.9)}
.sheet-wrap.in .sheet{transform:none}
.grabber{width:40px;height:5px;border-radius:3px;background:var(--line-strong);margin:4px auto 10px}
.sheet h2{margin:0 0 4px;font-size:1.15rem;font-weight:600}
.f-group{margin-top:18px}
.f-group > h4{margin:0 0 10px;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip{height:36px;padding:0 14px;font-size:.86rem}
.sheet-foot{position:sticky;bottom:calc(-1 * (env(safe-area-inset-bottom,0px) + 18px));display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:22px;padding-block:12px calc(env(safe-area-inset-bottom,0px) + 18px);
  background:linear-gradient(transparent,rgba(var(--glass-rgb),.9) 30%)}

/* statistiques */
.st-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
@media (min-width:640px){.st-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.st{border-radius:22px;padding:16px;min-width:0}
.st span{display:block;font-size:.76rem;color:var(--ink-2)}
.st strong{display:block;font-size:1.5rem;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st small{display:block;color:var(--ink-3);font-size:.74rem;margin-top:2px}
.bars{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.bar-row .l{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .n{font-size:.84rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar-row .t{grid-column:1/-1;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar-row .t b{display:block;height:100%;border-radius:3px;background:var(--bar);transform-origin:left;animation:grow calc(var(--dur) * 2) var(--ease) both}
@keyframes grow{from{transform:scaleX(.2)}to{transform:none}}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--track);gap:2px}
.split b{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.84rem;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.fine{color:var(--ink-3);font-size:.78rem;margin:16px 4px 0;line-height:1.5}

/* bandeau */
.toast{position:fixed;z-index:80;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-160%);border-radius:999px;padding:12px 20px;
  font-size:.9rem;font-weight:500;max-width:calc(100% - 32px);text-align:center;transition:transform var(--dur) var(--ease);
  background:rgba(var(--glass-rgb),.9);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid var(--line);box-shadow:var(--shadow)}
.toast.in{transform:translate(-50%,0)}

/* flacon dessiné (aucune photo) */
.bottle .b-cap{fill:var(--bottle-cap)}
.bottle .b-glass{fill:var(--bottle-glass)}
.bottle .b-clear{fill:var(--bottle-clear);stroke:var(--bottle-hi);stroke-width:1}
.bottle .b-hi{fill:var(--bottle-hi)}
.bottle .b-lab{fill:var(--bottle-label)}
.bottle .b-line{stroke:var(--bottle-hi);stroke-width:1;fill:none}
.bottle .b-sh{fill:var(--bottle-shadow)}
body.locked{overflow:hidden}
</style>

<script>

/* ============ Stockage (IndexedDB) ============
   Couche « dépôt » unique : all / get / put / del / clear.
   Chaque fiche porte id, createdAt, updatedAt : un adaptateur de synchronisation cloud
   pourra plus tard comparer updatedAt et pousser/tirer les fiches sans toucher à l'interface. */
const DB = (() => {
  const NAME = "parfum-db", VER = 1, STORES = ["perfumes", "wishlist", "images", "kv"];
  let dbp = null, mem = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      let r; try { r = indexedDB.open(NAME, VER); } catch (e) { return rej(e); }
      r.onupgradeneeded = () => { const d = r.result; for (const s of STORES) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error("blocked"));
    });
    return dbp;
  }
  function req(store, mode, fn) {
    if (mem) return Promise.resolve(fn(memStore(store)));
    return open().then(d => new Promise((res, rej) => {
      const t = d.transaction(store, mode); const q = fn(t.objectStore(store));
      t.oncomplete = () => res(q && "result" in q ? q.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    }));
  }
  function memStore(name) {
    const m = mem[name] || (mem[name] = new Map());
    return { getAll: () => ({ result: [...m.values()] }), get: k => ({ result: m.get(k) }), put: (v, k) => (m.set(k, v), { result: k }), delete: k => (m.delete(k), {}), clear: () => (m.clear(), {}) };
  }
  return {
    async ready() { try { await open(); return true; } catch { mem = {}; return false; } },
    all: s => req(s, "readonly", st => st.getAll()).then(r => r || []),
    get: (s, k) => req(s, "readonly", st => st.get(k)),
    put: (s, k, v) => req(s, "readwrite", st => st.put(v, k)),
    del: (s, k) => req(s, "readwrite", st => st.delete(k)),
    clear: s => req(s, "readwrite", st => st.clear()),
    get volatile() { return !!mem; }
  };
})();

/* ============ Images ============ */
async function compress(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let w = img.naturalWidth, h = img.naturalHeight; const k = Math.min(1, 1400 / Math.max(w, h));
    w = Math.round(w * k); h = Math.round(h * k);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    c.getContext("2d").drawImage(img, 0, 0, w, h);
    return await new Promise(res => c.toBlob(b => res(b || file), "image/jpeg", .86));
  } finally { URL.revokeObjectURL(url); }
}
async function storeImage(blob) { const id = uid(); await DB.put("images", id, blob); S.img.set(id, URL.createObjectURL(blob)); return id; }
async function dropImage(id) { if (!id) return; await DB.del("images", id).catch(() => {}); const u = S.img.get(id); if (u) URL.revokeObjectURL(u); S.img.delete(id); }
async function copyImage(id) { if (!id) return null; const b = await DB.get("images", id); return b ? storeImage(b) : null; }
async function loadImages() {
  const ids = [...S.perfumes, ...S.wishlist].map(x => x.imageId).filter(Boolean);
  await Promise.all(ids.map(async id => { if (S.img.has(id)) return; const b = await DB.get("images", id).catch(() => null); if (b) S.img.set(id, URL.createObjectURL(b)); }));
}
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
function dataURLToBlob(u) {
  const [head, data] = String(u).split(","); const mime = (head.match(/data:([^;]+)/) || [])[1] || "image/jpeg";
  const bin = atob(data); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
function visual(item) {

  return u ? `<img src="${u}" alt="${esc(item.name)}" decoding="async">` : bottle(item.variant || variantFor(item.id));

/* ============ Recherche, filtres, tri ============ */
function haystack(p) { return norm([p.name, p.brand, p.family, concLabel(p.concentration), p.concentration, ...(p.notesTop || []), ...(p.notesHeart || []), ...(p.notesBase || []), p.description].join(" ")); }
function filtered({ seg = false } = {}) {
  const f = S.filters, toks = norm(S.q).split(/\s+/).filter(Boolean);
  const min = parseNum(f.min), max = parseNum(f.max);
  let out = S.perfumes.filter(p => {
    if (toks.length) { const h = haystack(p); if (!toks.every(t => h.includes(t))) return false; }
    if (f.fav && !p.favorite) return false;
    if (f.brands.length && !f.brands.includes((p.brand || "").trim())) return false;
    if (f.conc.length && !f.conc.includes(p.concentration)) return false;
    if (f.fam.length && !f.fam.includes(p.family)) return false;
    if (f.status.length && !f.status.includes(p.status)) return false;
    if (f.vol.length && !f.vol.includes(p.volume)) return false;
    if (min != null && (p.price == null || p.price < min)) return false;
    if (max != null && (p.price == null || p.price > max)) return false;
    if (seg && S.seg !== "all") { if (S.seg === "fav" ? !p.favorite : p.status !== S.seg) return false; }
    return true;
  });
  const nullLast = (a, b, fn) => (a == null) - (b == null) || fn();
  const by = {
    alpha: (a, b) => (a.name || "").localeCompare(b.name || "", "fr", { sensitivity: "base" }),
    priceAsc: (a, b) => nullLast(a.price, b.price, () => a.price - b.price),
    priceDesc: (a, b) => nullLast(a.price, b.price, () => b.price - a.price),
    added: (a, b) => b.createdAt - a.createdAt,
    purchase: (a, b) => nullLast(a.purchaseDate || null, b.purchaseDate || null, () => (b.purchaseDate || "").localeCompare(a.purchaseDate || ""))
  };
  return out.sort(by[S.sort] || by.added);
}
function activeFilterCount() { const f = S.filters; return f.brands.length + f.conc.length + f.fam.length + f.status.length + f.vol.length + (f.min !== "" ? 1 : 0) + (f.max !== "" ? 1 : 0) + (f.fav ? 1 : 0); }

/* ============ Statistiques (calculées uniquement depuis vos fiches) ============ */
function computeStats(list) {
  const brandMap = new Map(), famMap = new Map(), concMap = new Map();
  let fav = 0, spent = 0, value = 0, volume = 0, bottles = 0, priced = 0; const st = { neuf: 0, ouvert: 0, termine: 0 };
  for (const p of list) {
    const q = Math.max(1, p.quantity || 1); bottles += q;
    const b = (p.brand || "").trim(); if (b) { const k = norm(b); const e = brandMap.get(k) || { label: b, n: 0 }; e.n++; brandMap.set(k, e); }
    if (p.family) famMap.set(p.family, (famMap.get(p.family) || 0) + 1);
    if (p.concentration) concMap.set(p.concentration, (concMap.get(p.concentration) || 0) + 1);
    if (p.favorite) fav++;
    if (p.price != null) { priced++; spent += p.price * q; if (p.status !== "termine") value += p.price * q; }
    if (p.volume != null) volume += p.volume * q;
    if (st[p.status] != null) st[p.status]++;
  }
  const top = m => [...m.entries()].map(([k, v]) => typeof v === "number" ? { label: k, n: v } : v).sort((a, b) => b.n - a.n || a.label.localeCompare(b.label, "fr"));
  return { count: list.length, bottles, brands: brandMap.size, fav, spent, value, volume, priced, st, topBrands: top(brandMap), topFam: top(famMap), topConc: top(concMap).map(x => ({ ...x, label: concLabel(x.label) })) };
}

/* ============ Pages superposées ============ */
const stack = [];
function lock() { document.body.classList.toggle("locked", stack.length > 0); }
function paint(o) { const t = o.body || o.el; const top = t.scrollTop; t.innerHTML = o.render(o); t.scrollTop = top; o.after && o.after(o); }
function openPage(render, opts = {}) {
  const el = document.createElement("div"); el.className = "ov"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true");
  document.body.appendChild(el);
  const o = { el, render, ...opts }; stack.push(o); paint(o); lock();
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("in")));
  return o;
}
function openSheet(render, opts = {}) {
  const el = document.createElement("div"); el.className = "sheet-wrap"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true");
  el.innerHTML = `<div class="scrim" data-act="close"></div><div class="sheet"></div>`;
  document.body.appendChild(el);
  const o = { el, body: el.querySelector(".sheet"), render, ...opts }; stack.push(o); paint(o); lock();
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("in")));
  return o;
}
function closeTop() {
  const o = stack.pop(); if (!o) return;
  o.el.classList.remove("in"); lock();
  const ms = S.settings.motion === "none" ? 0 : 400; setTimeout(() => o.el.remove(), ms);
}
function closeAll() { while (stack.length) closeTop(); }
function refresh() { renderView(); for (const o of stack) if (o.live) paint(o); }

const field = (label, input, opt = true) => `<label class="field"><span>${label}${opt ? "" : " <em>· obligatoire</em>"}</span>${input}</label>`;
const inp = (name, val, attrs = "") => `<input name="${name}" id="f-${name}" value="${esc(val ?? "")}" ${attrs}>`;
function photoBlock(st, item) {
  const u = st.newURL || (st.removed ? null : (st.imageId && S.img.get(st.imageId)));
  return `<div class="visual photo glass ${u ? "" : "ph"}">${u ? `<img src="${u}" alt="Photo du flacon">` : bottle(item.variant || variantFor(item.id))}</div>
    <div class="photo-actions">

      <label class="mini">${ic("image", "sm")}Galerie<input type="file" accept="image/*" data-photo hidden></label>
      ${u ? `<button type="button" class="mini warn" data-fact="photo-remove">${ic("x", "sm")}Retirer</button>` : ""}</div>`;
}
function wirePhoto(o, st, item) {
  const box = o.el.querySelector("[data-photobox]");
  const draw = () => { box.innerHTML = photoBlock(st, item); };
  o.el.addEventListener("change", async e => {
    if (!e.target.matches("[data-photo]")) return;
    const f = e.target.files && e.target.files[0]; if (!f) return;
    try { const b = await compress(f); if (st.newURL) URL.revokeObjectURL(st.newURL); st.newBlob = b; st.newURL = URL.createObjectURL(b); st.removed = false; draw(); }
    catch { toast("Image illisible. Essayez une photo JPEG ou PNG."); }
  });
  o.el.addEventListener("click", e => {
    if (e.target.closest('[data-fact="photo-remove"]')) { if (st.newURL) URL.revokeObjectURL(st.newURL); st.newBlob = null; st.newURL = null; st.removed = true; draw(); }
  });
}
async function resolveImage(st, previousId) {
  if (st.newBlob) { const id = await storeImage(st.newBlob); URL.revokeObjectURL(st.newURL); return { id, drop: previousId }; }
  if (st.removed) return { id: null, drop: previousId };
  return { id: previousId || null, drop: null };
}

  const uniq = arr => [...new Set(arr)];
  const brands = uniq(S.perfumes.map(p => (p.brand || "").trim()).filter(Boolean)).sort((a, b) => a.localeCompare(b, "fr"));
  const fams = uniq(S.perfumes.map(p => p.family).filter(Boolean)).sort((a, b) => a.localeCompare(b, "fr"));
  const concs = CONC.filter(([k]) => S.perfumes.some(p => p.concentration === k));
  const vols = uniq(S.perfumes.map(p => p.volume).filter(v => v != null)).sort((a, b) => a - b);
  const chips = (key, items) => items.length ? `<div class="chips">${items.map(([v, l]) => `<button type="button" class="chip ${f[key].includes(v) ? "on" : ""}" data-fk="${key}" data-fv="${esc(String(v))}">${esc(l)}</button>`).join("")}</div>` : `<p class="hint">Aucune valeur dans la collection.</p>`;
  const o = openSheet(() => `<div class="grabber"></div>
    <div class="row-between"><h2>Filtres et tri</h2><button type="button" class="icon-btn" data-act="close" aria-label="Fermer">${ic("x")}</button></div>
    <div class="f-group"><h4>Trier par</h4><div class="chips">${SORTS.map(([k, l]) => `<button type="button" class="chip ${sort === k ? "on" : ""}" data-fsort="${k}">${l}</button>`).join("")}</div></div>
    <div class="f-group"><label class="switch"><span>Favoris uniquement</span><input type="checkbox" id="ff-fav" ${f.fav ? "checked" : ""}><i></i></label></div>
    <div class="f-group"><h4>Marque</h4>${chips("brands", brands.map(b => [b, b]))}</div>
    <div class="f-group"><h4>Prix (€)</h4><div class="f-row"><label class="field"><span>Minimum</span><input id="ff-min" inputmode="decimal" value="${esc(f.min)}" placeholder="0"></label><label class="field"><span>Maximum</span><input id="ff-max" inputmode="decimal" value="${esc(f.max)}" placeholder="—"></label></div></div>
    <div class="f-group"><h4>Contenance</h4>${chips("vol", vols.map(v => [v, v + " ml"]))}</div>
    <div class="f-group"><h4>Concentration</h4>${chips("conc", concs)}</div>
    <div class="f-group"><h4>Famille olfactive</h4>${chips("fam", fams.map(x => [x, x]))}</div>
    <div class="f-group"><h4>État du flacon</h4>${chips("status", STATUS)}</div>
    <div class="sheet-foot"><button type="button" class="btn ghost" data-fx="reset">Réinitialiser</button><button type="button" class="btn" data-fx="apply">Afficher ${countWith()}</button></div>`);
  function readInputs() { f.min = o.body.querySelector("#ff-min").value.trim(); f.max = o.body.querySelector("#ff-max").value.trim(); f.fav = o.body.querySelector("#ff-fav").checked; }
  function countWith() { const keep = S.filters, ks = S.sort; S.filters = f; const n = filtered().length; S.filters = keep; S.sort = ks; return `${n} parfum${n > 1 ? "s" : ""}`; }
  const updateCount = () => { const b = o.body.querySelector('[data-fx="apply"]'); if (b) b.textContent = "Afficher " + countWith(); };
  o.body.addEventListener("click", e => {
    const c = e.target.closest("[data-fk]"), s = e.target.closest("[data-fsort]"), x = e.target.closest("[data-fx]");
    if (c) { readInputs(); const k = c.dataset.fk; let v = c.dataset.fv; if (k === "vol") v = Number(v); const i = f[k].indexOf(v); i >= 0 ? f[k].splice(i, 1) : f[k].push(v); c.classList.toggle("on"); updateCount(); }
    if (s) { sort = s.dataset.fsort; o.body.querySelectorAll("[data-fsort]").forEach(b => b.classList.toggle("on", b === s)); }
    if (x && x.dataset.fx === "reset") { Object.assign(f, emptyFilters()); sort = "added"; paint(o); }
    if (x && x.dataset.fx === "apply") { readInputs(); S.filters = f; S.sort = sort; saveSettings(); closeTop(); renderView(); }
  });
  o.body.addEventListener("input", () => { readInputs(); updateCount(); });
}

/* ---- Statistiques ---- */
function openStats() {
  openPage(() => {
    const s = computeStats(S.perfumes), ex = S.perfumes.some(p => p.example);
    const bars = items => { const max = Math.max(1, ...items.map(i => i.n)); return `<div class="bars">${items.slice(0, 6).map(i => `<div class="bar-row"><span class="l">${esc(i.label)}</span><span class="n">${i.n}</span><span class="t"><b style="width:${(i.n / max * 100).toFixed(1)}%"></b></span></div>`).join("")}</div>`; };
    const tile = (l, v, sub) => `<div class="st glass"><span>${l}</span><strong>${v}</strong>${sub ? `<small>${sub}</small>` : ""}</div>`;
    const tot = s.st.neuf + s.st.ouvert + s.st.termine;
    const splitCol = { neuf: "var(--bar)", ouvert: "color-mix(in srgb,var(--bar) 55%,transparent)", termine: "color-mix(in srgb,var(--bar) 22%,transparent)" };
    return `<div class="ov-inner">
      <div class="ov-bar"><button type="button" class="icon-btn glass" data-act="close" aria-label="Retour">${ic("chevL")}</button><span class="spacer"></span></div>
      <div class="view-head" style="padding-top:0"><div><h2>Statistiques</h2><p>Calculées à partir de vos ${s.count} fiche${s.count > 1 ? "s" : ""}</p></div></div>
      ${!s.count ? `<div class="empty glass">${ic("chart")}<h3>Rien à mesurer pour l’instant</h3><p>Les chiffres apparaîtront dès votre premier parfum ajouté.</p><button type="button" class="btn" data-act="add">${ic("plus", "sm")}Ajouter un parfum</button></div>` : `
      <div class="st-grid">
        ${tile("Parfums", s.count, `${s.bottles} flacon${s.bottles > 1 ? "s" : ""}`)}${tile("Marques", s.brands)}
        ${tile("Total dépensé", money(s.spent), s.priced < s.count ? `${s.count - s.priced} sans prix` : "")}${tile("Valeur de la collection", money(s.value), "Hors flacons terminés")}
        ${tile("Contenance totale", fmtVol(s.volume))}${tile("Ouverts", s.st.ouvert)}${tile("Neufs", s.st.neuf)}${tile("Terminés", s.st.termine)}
      </div>
      ${tot ? `<section class="sec glass"><h3>État des flacons</h3><div class="split">${STATUS.filter(([k]) => s.st[k]).map(([k]) => `<b style="width:${s.st[k] / tot * 100}%;background:${splitCol[k]}"></b>`).join("")}</div>
        <div class="legend">${STATUS.map(([k, l]) => `<span><i style="background:${splitCol[k]}"></i>${l} · ${s.st[k]}</span>`).join("")}</div></section>` : ""}
      <section class="sec glass"><h3>Marques les plus représentées</h3>${s.topBrands.length ? bars(s.topBrands) : '<p class="hint">Renseignez la marque de vos parfums.</p>'}</section>
      <section class="sec glass"><h3>Familles olfactives</h3>${s.topFam.length ? bars(s.topFam) : '<p class="hint">Renseignez la famille olfactive pour voir la répartition.</p>'}</section>
      <section class="sec glass"><h3>Concentrations</h3>${s.topConc.length ? bars(s.topConc) : '<p class="hint">Aucune concentration renseignée.</p>'}</section>
      <p class="fine">Total dépensé = prix d’achat × quantité. Valeur de la collection = même calcul, sans les flacons terminés.${ex ? " Les fiches d’exemple sont incluses tant que vous ne les effacez pas." : ""}</p>`}
    </div>`;
  }, { live: true, kind: "stats" });
}

/* ============ Sauvegarde : export / import ============ */
async function exportData() {
  try {
    const images = {};
    for (const it of [...S.perfumes, ...S.wishlist]) if (it.imageId) { const b = await DB.get("images", it.imageId); if (b) images[it.imageId] = await blobToDataURL(b); }
    const data = { app: "parfum", schema: 1, exportedAt: new Date().toISOString(), perfumes: S.perfumes, wishlist: S.wishlist, settings: S.settings, images };
    const name = `parfum-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`;
    const file = new File([JSON.stringify(data)], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "Sauvegarde Parfum" }); toast("Sauvegarde exportée"); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast(inFrame ? "L’export fonctionne dans l’app installée, pas dans cet aperçu" : "Sauvegarde téléchargée");
  } catch (e) { console.error(e); toast("Export impossible. Réessayez."); }
}
async function importData(file) {
  let d; try { d = JSON.parse(await file.text()); } catch { return toast("Fichier illisible : choisissez une sauvegarde .json"); }
  if (!d || d.app !== "parfum" || !Array.isArray(d.perfumes)) return toast("Ce fichier n’est pas une sauvegarde Parfum");
  try {
    for (const [id, u] of Object.entries(d.images || {})) { const b = dataURLToBlob(u); await DB.put("images", id, b); const old = S.img.get(id); if (old) URL.revokeObjectURL(old); S.img.set(id, URL.createObjectURL(b)); }
    for (const p of d.perfumes) if (p && p.id && p.name) { await DB.put("perfumes", p.id, p); upsert(S.perfumes, p); }
    for (const w of (d.wishlist || [])) if (w && w.id && w.name) { await DB.put("wishlist", w.id, w); upsert(S.wishlist, w); }
    if (d.settings) { S.settings = { ...DEFAULTS, ...d.settings }; S.sort = S.settings.sort || "added"; saveSettings(); applySettings(); }
    refresh(); toast(`${d.perfumes.length} parfum${d.perfumes.length > 1 ? "s" : ""} et ${(d.wishlist || []).length} envie${(d.wishlist || []).length > 1 ? "s" : ""} importés`);
  } catch (e) { console.error(e); toast("Import interrompu. Vérifiez le fichier."); }
}

/* ============ Bandeau ============ */
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("in"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("in"), 2600); }

/* ============ Actions ============ */
const ACTIONS = {
  tab: el => { location.hash = el.dataset.val; },
  theme: el => { S.settings.theme = el.dataset.val; saveSettings(); applySettings(); refresh(); },
  open: el => openDetail(el.dataset.id),
  fav: async el => { const p = S.perfumes.find(x => x.id === el.dataset.id); if (!p) return; p.favorite = !p.favorite; await savePerfume(p); refresh(); },
  add: () => { if (stack.length && stack[stack.length - 1].kind === "stats") closeTop(); openPerfumeForm(); },
  "add-wish": () => openWishForm(),
  filters: () => openFilters(),
  stats: () => openStats(),
  "fav-filter": () => { S.filters.fav = !S.filters.fav; renderView(); },
  "reset-filters": () => { S.filters = emptyFilters(); renderView(); },
  "reset-all": () => { S.filters = emptyFilters(); S.q = ""; S.seg = "all"; renderView(); },
  "clear-q": () => { S.q = ""; renderView(); },
  close: () => closeTop(),
  edit: el => { const p = S.perfumes.find(x => x.id === el.dataset.id); if (p) openPerfumeForm(p); },
  dup: async el => {
    const p = S.perfumes.find(x => x.id === el.dataset.id); if (!p) return;
    const copy = { ...p, id: uid(), name: p.name + " (copie)", imageId: await copyImage(p.imageId), example: false, createdAt: Date.now(),
      notesTop: [...(p.notesTop || [])], notesHeart: [...(p.notesHeart || [])], notesBase: [...(p.notesBase || [])] };
    await savePerfume(copy); closeTop(); refresh(); openDetail(copy.id); toast("Fiche dupliquée");
  },
  "del-ask": () => { const o = stack[stack.length - 1]; o.confirm = true; paint(o); o.el.scrollTo({ top: o.el.scrollHeight, behavior: "smooth" }); },
  "del-cancel": () => { const o = stack[stack.length - 1]; o.confirm = false; paint(o); },
  del: async el => { await deletePerfume(el.dataset.id); closeTop(); refresh(); toast("Parfum supprimé"); },
  layout: el => { S.settings.layout = el.dataset.val; saveSettings(); renderView(); },
  seg: el => { S.seg = el.dataset.val; renderView(); },
  "wish-edit": el => { const w = S.wishlist.find(x => x.id === el.dataset.id); if (w) openWishForm(w); },
  "wish-buy": el => {
    const w = S.wishlist.find(x => x.id === el.dataset.id); if (!w) return;
    openPerfumeForm(null, { prefill: { name: w.name, brand: w.brand, price: w.price, personalNotes: w.notes, imageId: w.imageId, purchaseDate: new Date().toISOString().slice(0, 10) }, fromWish: w.id });
  },
  "wish-del-ask": el => { S.wishConfirm = el.dataset.id; renderView(); },
  "wish-del-cancel": () => { S.wishConfirm = null; renderView(); },
  "wish-del": async el => { await deleteWish(el.dataset.id); S.wishConfirm = null; renderView(); toast("Retiré de la wishlist"); },
  set: el => { S.settings[el.dataset.key] = el.dataset.val; saveSettings(); applySettings(); renderView(); },
  export: () => exportData(),
  import: () => $("#import-file").click(),
  "clear-examples": async () => {
    for (const p of S.perfumes.filter(x => x.example)) await deletePerfume(p.id);
    for (const w of S.wishlist.filter(x => x.example)) await deleteWish(w.id);
    refresh(); toast("Exemples effacés");
  },
  "wipe-ask": () => { S.wipeConfirm = true; renderView(); },
  "wipe-cancel": () => { S.wipeConfirm = false; renderView(); },
  wipe: async () => {
    await Promise.all(["perfumes", "wishlist", "images"].map(s => DB.clear(s)));
    for (const u of S.img.values()) URL.revokeObjectURL(u);
    S.img.clear(); S.perfumes = []; S.wishlist = []; S.wipeConfirm = false; S.filters = emptyFilters();
    renderView(); toast("Toutes les données ont été effacées");
  }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.tagName === "A") return;
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && stack.length) { closeTop(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("article[data-act]")) { e.preventDefault(); ACTIONS.open(e.target); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.matches("[data-search]")) { S.q = t.value; renderResults(); }
  if (t.matches("[data-setting]")) { const k = t.dataset.setting; S.settings[k] = Number(t.value); const v = $("#v-" + k); if (v) v.textContent = t.value + t.dataset.unit; applySettings(); saveSettings(); }
});
document.addEventListener("change", e => {
  if (e.target.matches("[data-sort]")) { S.sort = e.target.value; saveSettings(); renderView(); }
  if (e.target.id === "import-file") { const f = e.target.files && e.target.files[0]; if (f) importData(f); e.target.value = ""; }
});
document.addEventListener("submit", e => { if (e.target.closest("form")) e.preventDefault(); }, true);

/* ============ Navigation par onglets ============ */
function fromHash() { const h = location.hash.replace("#", ""); return VIEWS[h] ? h : "accueil"; }
window.addEventListener("hashchange", () => { closeAll(); S.tab = fromHash(); S.wipeConfirm = false; S.wishConfirm = null; renderView(); window.scrollTo({ top: 0 }); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { applySettings(); refresh(); });
new MutationObserver(() => { applySettings(); refresh(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

/* ============ Démarrage ============ */
async function boot() {
  loadSettings(); applySettings();
  S.tab = fromHash(); renderView();
  await DB.ready();
  try {
    if (!localStorage.getItem("parfum.settings")) { const kv = await DB.get("kv", "settings"); if (kv) { S.settings = { ...DEFAULTS, ...kv }; S.sort = S.settings.sort || "added"; applySettings(); } }
  } catch {}
  S.perfumes = await DB.all("perfumes").catch(() => []);
  S.wishlist = await DB.all("wishlist").catch(() => []);
  const seeded = await DB.get("kv", "seeded").catch(() => true);
  if (!seeded && !S.perfumes.length && !S.wishlist.length) {
    const ex = seedExamples();
    for (const p of ex) await savePerfume(p);
    await saveWish({ id: uid(), name: "Aventus", brand: "Creed", price: 330, url: "", notes: "À sentir en boutique avant d’acheter.", imageId: null, variant: "tall", example: true, createdAt: Date.now() });
    await DB.put("kv", "seeded", true);
  }
  await loadImages();
  renderView();
  if (DB.volatile) toast("Stockage indisponible : les données ne seront pas conservées");
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
  const secure = location.protocol === "https:" || location.hostname === "localhost";
  if ("serviceWorker" in navigator && !inFrame && secure && document.querySelector('link[rel="manifest"]')) {
    try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch {}
  }
}
boot();
</script>
